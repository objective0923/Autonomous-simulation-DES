[project]
name = "crois-amr-des-server"
version = "0.2.0"
description = "SimPy-backed CROIS manufacturing and AMR DES API"
requires-python = ">=3.12"
dependencies = [
  "simpy==4.1.1",
  "fastapi==0.121.1",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
